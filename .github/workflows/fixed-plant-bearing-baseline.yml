name: Fixed-plant bearing baseline tests

on:
  push:
    paths:
      - 'research/fixed-plant-bearing-baseline/**'
      - '.github/workflows/fixed-plant-bearing-baseline.yml'
  pull_request:
    paths:
      - 'research/fixed-plant-bearing-baseline/**'
      - '.github/workflows/fixed-plant-bearing-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    defaults:
      run:
        working-directory: research/fixed-plant-bearing-baseline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: research/fixed-plant-bearing-baseline/pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: python -m pytest -ra
