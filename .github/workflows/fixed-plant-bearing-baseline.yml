name: Fixed-plant bearing baseline tests

on:
  push:
    paths:
      - 'research/fixed-plant-bearing-baseline/**'
      - '.github/workflows/fixed-plant-bearing-baseline.yml'
  pull_request:
    paths:
      - 'research/fixed-plant-bearing-baseline/**'
      - '.github/workflows/fixed-plant-bearing-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    defaults:
      run:
        working-directory: research/fixed-plant-bearing-baseline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: research/fixed-plant-bearing-baseline/pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: python -m pytest -ra

  benchmark-cwru:
    # One-off supervised research run: the tagged push runs on GitHub's hosted CPU runner.
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[benchmark-cwru]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: research/fixed-plant-bearing-baseline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/fixed-plant-bearing-baseline/pyproject.toml
      - name: Install dataset and ONNX dependencies
        run: python -m pip install -e '.[datasets,onnx]'
      - name: Download and build CWRU into the ephemeral runner
        run: bearing-datasets --root /tmp/mineos-bearing-datasets build cwru
      - name: Verify sample-rate and label coverage
        run: |
          python - <<'PY'
          import bearing_datasets as bd
          ds = bd.open("cwru", root="/tmp/mineos-bearing-datasets")
          meta = ds.metadata()
          de = meta[meta["channel"].astype(str).str.upper() == "DE"]
          for rate in (12000, 48000):
              cohort = de[de["fs"].astype(float) == rate]
              print(f"{rate} Hz: {len(cohort)} recordings; labels={sorted(cohort['fault_type'].astype(str).unique())}")
          healthy_rates = sorted(de.loc[de["fault_type"] == "normal", "fs"].astype(float).unique())
          if healthy_rates != [48000.0]:
              raise SystemExit(f"Unexpected CWRU healthy sample-rate coverage: {healthy_rates}")
          PY
      - name: Train 12 kHz three-class fault classifier
        run: |
          mineos-bearing-baseline train-library \
            --data-root /tmp/mineos-bearing-datasets \
            --dataset cwru --channel DE --sample-rate 12000 \
            --window-size 2048 --stride 2048 --cv-folds 5 \
            --out-dir artifacts/cwru-de-12k --export-onnx
      - name: Train 48 kHz four-class classifier
        run: |
          mineos-bearing-baseline train-library \
            --data-root /tmp/mineos-bearing-datasets \
            --dataset cwru --channel DE --sample-rate 48000 \
            --window-size 2048 --stride 2048 --cv-folds 5 \
            --out-dir artifacts/cwru-de-48k --export-onnx
      - name: Publish benchmark metrics
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print("| Cohort | Classes | Windows | Groups | Folds | Accuracy | Macro F1 | ONNX parity | Excluded wrong-location faults |")
          print("|---|---|---:|---:|---:|---:|---:|---|---:|")
          for name in ("cwru-de-12k", "cwru-de-48k"):
              m = json.loads((Path("artifacts") / name / "metrics.json").read_text())
              parity = m.get("onnx_export", {}).get("label_parity", False)
              excluded = m.get("source", {}).get("excluded_nonmatching_fault_location_signals", 0)
              print(f"| {name} | {', '.join(m['labels'])} | {m['n_windows']} | {m['n_groups']} | {m['actual_folds']} | {m['accuracy']:.4f} | {m['macro_f1']:.4f} | {parity} | {excluded} |")
              print(f"\\n### {name}: per-class metrics")
              for label in m["labels"]:
                  scores = m["classification_report"][label]
                  print(f"- {label}: precision={scores['precision']:.4f}, recall={scores['recall']:.4f}, F1={scores['f1-score']:.4f}")
              print(f"- Groups per class: `{json.dumps(m['groups_per_label'], sort_keys=True)}`")
              print(f"- Confusion matrix (label order {m['labels']}): `{json.dumps(m['confusion_matrix'])}`")
          PY
      - name: Upload metrics and model cards only
        uses: actions/upload-artifact@v4
        with:
          name: mineos-cwru-research-results
          retention-days: 14
          if-no-files-found: error
          path: |
            research/fixed-plant-bearing-baseline/artifacts/cwru-de-12k/metrics.json
            research/fixed-plant-bearing-baseline/artifacts/cwru-de-12k/feature_schema.json
            research/fixed-plant-bearing-baseline/artifacts/cwru-de-12k/model_card.md
            research/fixed-plant-bearing-baseline/artifacts/cwru-de-12k/source_manifest.csv
            research/fixed-plant-bearing-baseline/artifacts/cwru-de-48k/metrics.json
            research/fixed-plant-bearing-baseline/artifacts/cwru-de-48k/feature_schema.json
            research/fixed-plant-bearing-baseline/artifacts/cwru-de-48k/model_card.md
            research/fixed-plant-bearing-baseline/artifacts/cwru-de-48k/source_manifest.csv
